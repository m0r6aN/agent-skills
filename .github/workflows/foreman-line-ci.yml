name: foreman-line-ci

# No path filters: documentation-only PRs need these named checks too.
on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Preserve repository LF bytes
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Test the package runner and reuse core without subprocess effects
        run: |
          node --test scripts/foreman-line-ci.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/ci-reuse.test.mjs
          exit $LASTEXITCODE

      # CI-P1: sole decision point, completes before any sweep work (spec C12).
      - name: Decide reuse or fallback from Actions-API evidence
        id: decide
        if: ${{ success() || failure() }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-reuse.mjs decide

      - name: Install all 20 packages, then aggregate every check
        if: ${{ (success() || failure()) && steps.decide.outputs.decision == 'fallback' }}
        shell: pwsh
        run: |
          $npmCli = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          node scripts/foreman-line-ci.mjs "$npmCli"
          exit $LASTEXITCODE

      # Reused head: re-verify the evidence; on any flip run the full sweep in
      # its place and exit with the sweep's code (spec AC4/AC5).
      - name: Verify reuse evidence or run the sweep in its place
        if: ${{ (success() || failure()) && steps.decide.outputs.decision == 'reuse' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_REUSE_EVIDENCE: ${{ steps.decide.outputs.evidence_record }}
        run: |
          $npmCli = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          node scripts/ci-reuse.mjs verify --sweep node scripts/foreman-line-ci.mjs "$npmCli"
          exit $LASTEXITCODE

  integration-report:
    name: integration-report
    needs: test
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Report package job outcome without masking failure
        shell: pwsh
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if ($env:TEST_RESULT -ne 'success') {
            'Foreman Line package checks did not succeed. See the test job for per-package outcomes.' >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          'Foreman Line package checks passed. This is not live adapter, installed-host or human D4 acceptance.' >> $env:GITHUB_STEP_SUMMARY
