# U1 producer workflow — FK-P18′ evidence packaging and submission (unattended lane).
# Design: plugins/foreman-line/docs/goals/foreman-kernel/U1-workflow-design-2026-09-30.md
# Contract: U1-contract-2026-09-29.md sha256:8d5f849cf22f6662f17c2502142e354d82f8f5604d64b511250abc72157df9d5
# Amendments: U1-8-closure-amendments-2026-10-01.md (A-U1.8.08/A-U1.8.10/A-U1.8.12/
# A-U1.8.13/A-U1.8.15/A-U1.8.16 mechanism notes).
#
# Lane: evidence submission only. The verification decision is NEVER produced, transported,
# or persisted here (the stored decision is authored by the verifier identity itself).
# NAMESPACE (A-U1.8.08): producer objects land ONLY under
#   u1/m0r6an/agent-skills/runs/<runId>/p<NN>/...
# where p<NN> is the provider GITHUB_RUN_ATTEMPT (2 digits). The producer NEVER touches the
# decision, ledger or verification namespaces (runs/* is producer-scoped at the storage
# layer by ABAC prefix conditions; verifications/* and attempt-ledger/* are
# verifier-create-only).
# FORBIDDEN anywhere in this workflow (contract 2/3.3): `az storage immutability-policy`,
# `az storage blob delete`, `--overwrite true`, account keys, SAS URLs, `secrets.*` references,
# `attestations` permissions (F-14: INCOMPLETE-U1-18 is the named gap "not issued by the
# selected workflows"; absence never changes decision status). The single carve-out is the
# producer-probe job (A-U1.8.23): it attempts one REST DELETE of the probe's own reserved
# object runs/probe-<runId>-<random>-target.json, expecting a denial (403 or 409 immutable),
# and one create under verifications/probe-..., expecting 403; the outcomes are recorded.
# Authentication is GitHub OIDC -> u1-producer-mi only (environment u1-producer, unattended).
name: u1-produce
run-name: u1-produce submit run=${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      policy-digest:
        description: "subject.policyDigest from FK-P18′ authority"
        type: string
        required: true
      compiled-scope-digest:
        description: "subject.compiledScopeDigest from FK-P18′ authority"
        type: string
        required: true
      required-invariant-ids:
        description: "CSV of IA-5 IDs required for this promotion (first promotion: INV-U1-01..05)"
        type: string
        required: true
      promoted-refusal-class-ids:
        description: "CSV of IA-6 IDs (owner/FK-P19 parameter; never empty)"
        type: string
        required: true
      evidence-dir:
        type: string
        required: false
        default: "plugins/foreman-line/bypass-outage-harness/evidence"

concurrency:
  group: u1-produce-evidence
  cancel-in-progress: false

permissions: {}

jobs:
  producer-probe:
    # A-U1.8.23 clause 5: the producer-side denied-operation probes. The denial is classified by
    # HTTP status and x-ms-error-code. The record is producer-authored and corroborating only;
    # the owner's admin-side probes remain the INCOMPLETE-U1-09 evidence. Probe objects use the
    # reserved names runs/probe-<runId>-<random>... and verifications/probe-..., which cannot
    # match the producer package grammar runs/<runId>/pNN/....
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: u1-producer
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC -> u1-producer-mi)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: dc152b9d-c74e-4af1-aeeb-c23b95c68ab2
          tenant-id: ac08e2fd-34bf-4c87-a34f-c8c853ffc5e2
          subscription-id: 909e0322-c3c0-4bce-ae53-b3d2ed735bd4
      - name: Producer-side separation probes (create under verifications/, delete an own object)
        run: |
          python3 - <<'PYEOF'
          import base64, datetime, json, os, secrets, subprocess, urllib.error, urllib.parse, urllib.request

          ACCOUNT = "bs2jhgwvduljfdwdp"
          PRINCIPAL = "u1-producer-mi (dc152b9d-c74e-4af1-aeeb-c23b95c68ab2)"
          RUN = os.environ.get("GITHUB_RUN_ID", "0")

          def now_iso():
              return datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0) \
                        .isoformat().replace("+00:00", "Z")

          def token():
              return subprocess.run(["az", "account", "get-access-token", "--resource",
                                     "https://storage.azure.com/", "--query", "accessToken", "-o", "tsv"],
                                    capture_output=True, text=True, check=True).stdout.strip()

          def call(method, name, tok, body=None, create_only=False):
              url = "https://%s.blob.core.windows.net/u1-evidence/%s" % (ACCOUNT, urllib.parse.quote(name))
              headers = {"Authorization": "Bearer " + tok, "x-ms-version": "2023-11-03"}
              if method == "PUT":
                  headers["x-ms-blob-type"] = "BlockBlob"
                  headers["Content-Type"] = "application/octet-stream"
              if create_only:
                  headers["If-None-Match"] = "*"
              request = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  response = urllib.request.urlopen(request, timeout=60)
                  return response.status, None
              except urllib.error.HTTPError as ex:
                  return ex.code, ex.headers.get("x-ms-error-code")

          def oidc_claims():
              url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
              bearer = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
              if not url or not bearer:
                  return None
              request = urllib.request.Request(url + "&audience=api://AzureADTokenExchange",
                                               headers={"Authorization": "bearer " + bearer})
              try:
                  jwt = json.loads(urllib.request.urlopen(request, timeout=30).read())["value"]
                  payload = jwt.split(".")[1]
                  payload += "=" * (-len(payload) % 4)
                  c = json.loads(base64.urlsafe_b64decode(payload))
              except Exception:
                  return None
              return {k: c.get(k) for k in ("sub", "repository", "repository_id", "job_workflow_ref",
                                            "ref", "environment", "event_name")}

          probes = []
          try:
              tok = token()
              ver_name = "u1/m0r6an/agent-skills/verifications/probe-%s-%s.json" % (RUN, secrets.token_hex(6))
              status, code = call("PUT", ver_name, tok, b'{"probe":"producer-create-under-verifications"}', True)
              probes.append({"operation": "producer-create-under-verifications", "principal": PRINCIPAL,
                             "targetPrefix": "u1/m0r6an/agent-skills/verifications/probe-",
                             "expectedDenial": "403 AuthorizationPermissionMismatch (ABAC runs/* only)",
                             "observedHttpStatus": status, "observedErrorCode": code, "timestamp": now_iso()})
              own = "u1/m0r6an/agent-skills/runs/probe-%s-%s-target.json" % (RUN, secrets.token_hex(6))
              cstatus, ccode = call("PUT", own, tok, b'{"probe":"producer-delete-target"}', True)
              dstatus, dcode = call("DELETE", own, tok)
              probes.append({"operation": "producer-delete", "principal": PRINCIPAL,
                             "targetPrefix": "u1/m0r6an/agent-skills/runs/probe-",
                             "expectedDenial": "403 AuthorizationPermissionMismatch or 409 BlobImmutableDueToPolicy",
                             "setupHttpStatus": cstatus, "setupErrorCode": ccode,
                             "observedHttpStatus": dstatus, "observedErrorCode": dcode,
                             "timestamp": now_iso()})
          except Exception as ex:
              probes.append({"operation": "probe-error", "principal": PRINCIPAL,
                             "observedHttpStatus": None, "observedErrorCode": str(ex)[:200],
                             "timestamp": now_iso()})
          os.makedirs("probe-out", exist_ok=True)
          with open("probe-out/producer-probes.json", "w", encoding="utf-8") as f:
              json.dump({"probes": probes, "oidcClaims": oidc_claims()}, f, sort_keys=True)
          print(json.dumps(probes, indent=1))
          PYEOF
      - name: Upload the producer-side probe record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: u1-producer-probes-${{ github.run_id }}
          path: probe-out
          if-no-files-found: error

  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      bundle-byte-digest: ${{ steps.package.outputs.bundle-byte-digest }}
      bundle-doc-digest: ${{ steps.package.outputs.bundle-doc-digest }}
      artifact-count: ${{ steps.package.outputs.artifact-count }}
      evidence-origin: ${{ steps.package.outputs.evidence-origin }}
    needs: producer-probe
    steps:
      - name: Check out repository data (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the producer-side probe record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: u1-producer-probes-${{ github.run_id }}
          path: probe-in
      - name: Package evidence (early limits, strict parsing, IA-3 grammar, IA-2 digests)
        id: package
        env:
          EVIDENCE_DIR: ${{ inputs.evidence-dir }}
          POLICY_DIGEST: ${{ inputs.policy-digest }}
          COMPILED_SCOPE_DIGEST: ${{ inputs.compiled-scope-digest }}
          REQUIRED_INVARIANT_IDS: ${{ inputs.required-invariant-ids }}
          PROMOTED_REFUSAL_CLASS_IDS: ${{ inputs.promoted-refusal-class-ids }}
        run: |
          python3 - <<'PYEOF'
          import glob as _glob
          import hashlib, json, os, re, subprocess, sys

          MIB = 1024 * 1024
          LIMITS = {"bundle": 64 * MIB, "artifact": 8 * MIB, "count": 256, "depth": 16}
          SCHEMA = "u1/0.1.0"
          API_VERSION = "0.1.0"
          CONTRACT_DIGEST = "sha256:8d5f849cf22f6662f17c2502142e354d82f8f5604d64b511250abc72157df9d5"
          OWNER_SEGMENT = "m0r6an"
          REPO_SEGMENT = "agent-skills"
          REPOSITORY_ID = "m0r6aN/agent-skills"

          class LimitExceeded(Exception):
              pass

          def canon(obj):
              # F05.5/IA-2 canonical JSON bytes: compact; keys sorted by UTF-16 code-unit
              # order recursively; JSON.stringify-style string escaping; SafeInt numbers.
              def esc(s):
                  return json.dumps(s, ensure_ascii=False)[1:-1]
              def enc(o):
                  if o is None:
                      return "null"
                  if o is True:
                      return "true"
                  if o is False:
                      return "false"
                  if isinstance(o, int) and not isinstance(o, bool):
                      if o < 0 or o > 2**53 - 1:
                          raise ValueError("SafeInt bound")
                      return str(o)
                  if isinstance(o, str):
                      return '"' + esc(o) + '"'
                  if isinstance(o, list):
                      return "[" + ",".join(enc(x) for x in o) + "]"
                  if isinstance(o, dict):
                      items = sorted(o.items(), key=lambda kv: kv[0].encode("utf-16-be"))
                      return "{" + ",".join('"' + esc(k) + '":' + enc(v) for k, v in items) + "}"
                  raise TypeError(type(o))
              return enc(obj).encode("utf-8")

          def tag(b):
              return "sha256:" + hashlib.sha256(b).hexdigest()

          def doc_digest(domain, payload):
              return tag(canon({"domain": domain, "apiVersion": API_VERSION, "payload": payload}))

          def text_depth(raw):
              depth = 0
              max_depth = 0
              in_str = False
              esc = False
              for ch in raw.decode("utf-8", "strict"):
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == '"':
                          in_str = False
                  elif ch == '"':
                      in_str = True
                  elif ch in "[{":
                      depth += 1
                      if depth > max_depth:
                          max_depth = depth
                  elif ch in "]}":
                      depth -= 1
              return max_depth

          def strict_loads(raw):
              # F-16: depth-limited (16), duplicate-key-rejecting, NaN/Infinity-rejecting.
              if text_depth(raw) > LIMITS["depth"]:
                  raise LimitExceeded("U1_EVIDENCE_LIMIT_EXCEEDED: JSON depth > 16")
              def reject_constant(name):
                  raise ValueError("NaN/Infinity literal refused: " + name)
              def reject_dupes(pairs):
                  seen = set()
                  out = {}
                  for k, v in pairs:
                      if k in seen:
                          raise ValueError("duplicate key refused: " + k)
                      seen.add(k)
                      out[k] = v
                  return out
              return json.loads(raw.decode("utf-8"), parse_constant=reject_constant,
                                object_pairs_hook=reject_dupes)

          LOGICAL = re.compile(r"^[a-z0-9_-]{1,64}\Z")
          EXTENSION = re.compile(r"^[a-z0-9]{1,8}\Z")
          KINDS = {"enforcement-environment", "producer-identity", "code-input", "action-inputs",
                   "toolchain", "image", "configuration", "independence-model",
                   "execution-provenance", "observation", "negative-control", "retention-plan",
                   "verifier-context", "retrieval-check", "retention-observation", "separation-probe"}

          def check_package_path(p):
              # IA-3 grammar for the PRODUCER package (A-U1.8.08: audit/decision.json and all
              # verifier objects are never part of the producer package), default-deny.
              if not p.isascii() or "\\" in p or p.startswith("/") or p.endswith("/"):
                  raise ValueError("path-grammar: %r" % p)
              segs = p.split("/")
              if any(s in ("", ".", "..") for s in segs):
                  raise ValueError("path-grammar: %r" % p)
              if p == "bundle.json":
                  return ("bundleDoc", None, None)
              if p == "audit/decision.json":
                  raise ValueError("path-grammar: verifier/audit objects never in producer package")
              if len(segs) == 3 and segs[0] == "evidence" and segs[1] in KINDS:
                  if segs[1] in ("verifier-context", "retrieval-check", "retention-observation"):
                      raise ValueError("path-grammar: verifier namespace kind never in producer package")
                  fname = segs[2]
                  logical, dot, ext = fname.partition(".")
                  if not LOGICAL.match(logical):
                      raise ValueError("path-grammar logicalId: %r" % p)
                  if dot and not EXTENSION.match(ext):
                      raise ValueError("path-grammar extension: %r" % p)
                  return ("artifactPath", segs[1], logical)
              raise ValueError("path-grammar: %r" % p)

          def load_json(path, raw):
              if len(raw) > LIMITS["artifact"]:
                  raise LimitExceeded("U1_EVIDENCE_LIMIT_EXCEEDED: artifact > 8 MiB: %s" % path)
              try:
                  obj = strict_loads(raw)
              except LimitExceeded:
                  raise
              except Exception as e:
                  raise ValueError("U1_ARTIFACT_INVALID: %s unparsable: %s" % (path, e))
              return obj

          def add_artifact(store, rel, kind, logical, media, raw):
              if logical in store["logicalIds"]:
                  raise ValueError("duplicate logicalId: %s" % logical)
              store["logicalIds"].add(logical)
              if len(raw) > LIMITS["artifact"]:
                  raise LimitExceeded("U1_EVIDENCE_LIMIT_EXCEEDED: artifact > 8 MiB: %s" % rel)
              art = {"logicalId": logical, "mediaType": media, "byteLength": len(raw),
                     "byteDigest": tag(raw), "relativePath": rel}
              store["artifacts"].append(art)
              return art

          def write_artifact(store, rel, kind, logical, payload, media="application/json"):
              check_package_path(rel)
              raw = canon(payload)
              store["files"][rel] = raw
              return add_artifact(store, rel, kind, logical, media, raw)

          # ---- F-11: true evidenceOrigin literals, per feed file, from git state ----
          def feed_origin(path):
              tracked = subprocess.run(["git", "ls-files", "--error-unmatch", "--", path],
                                       capture_output=True).returncode == 0
              if not tracked:
                  return "ci-run-generated"
              dirty = subprocess.run(["git", "diff", "--quiet", "HEAD", "--", path],
                                     capture_output=True).returncode != 0
              return "ci-run-generated" if dirty else "fk-p17-committed"

          def row_provenance(origin, path, raw):
              base = {"artifactByteDigest": tag(raw), "evidenceOrigin": origin,
                      "repositoryId": REPOSITORY_ID}
              if origin == "fk-p17-committed":
                  base.update({"originKind": "committed-source",
                               "headSha": os.environ.get("GITHUB_SHA", ""),
                               "committedPath": path})
              else:
                  base.update({"originKind": "github-run",
                               "runId": os.environ.get("GITHUB_RUN_ID", ""),
                               "jobId": os.environ.get("GITHUB_JOB", ""),
                               "workflowRef": os.environ.get("GITHUB_WORKFLOW_REF", ""),
                               "headSha": os.environ.get("GITHUB_SHA", ""),
                               "event": os.environ.get("GITHUB_EVENT_NAME", ""),
                               "conclusion": "success"})
              return base

          # IA-5 FK-P17 anchors (contract IA-5 column 6): caseId -> required invariants.
          ANCHORS = {
              "CTL-01": ["INV-U1-01"], "CTL-02": ["INV-U1-01"],
              "BYP-SH-01": ["INV-U1-01"], "BYP-SH-02": ["INV-U1-01"], "BYP-SH-03": ["INV-U1-01"],
              "BYP-SP-01": ["INV-U1-01"], "BYP-SP-02": ["INV-U1-01"],
              "BYP-MC-01": ["INV-U1-01"], "BYP-MC-02": ["INV-U1-01"],
              "BYP-LK-01": ["INV-U1-01"], "BYP-LK-02": ["INV-U1-01"],
              "BYP-LK-03": ["INV-U1-01", "INV-U1-02"], "BYP-LK-04": ["INV-U1-01", "INV-U1-02"],
              "BYP-MB-01": ["INV-U1-01"], "BYP-MB-02": ["INV-U1-01", "INV-U1-04"],
              "BYP-MB-03": ["INV-U1-01"],
              "SST-01": ["INV-U1-05"], "SST-02": ["INV-U1-05"], "SST-03": ["INV-U1-05"],
              "RST-01": ["INV-U1-05"], "RST-02": ["INV-U1-05"],
              "NRE-01": ["INV-U1-06"], "NRE-02": ["INV-U1-06"], "NRE-03": ["INV-U1-06"],
          }

          def enrich_rows(doc, origin, source_path, source_raw, row_kinds):
              # A-U1.8.10: every observation/negative-control row records its producing
              # execution identity. Classifications and signals are carried verbatim -
              # never re-derived, never softened. observedResult is copied from the row's
              # own recorded classification; exitStatus is never invented.
              def enrich_row(row):
                  if not isinstance(row, dict):
                      return row
                  out = dict(row)
                  out.setdefault("executionProvenance", [row_provenance(origin, source_path, source_raw)])
                  if "observedResult" not in out and isinstance(out.get("classification"), str):
                      out["observedResult"] = out["classification"]
                  case_id = out.get("caseId")
                  if case_id in ANCHORS:
                      out.setdefault("invariantIds", ANCHORS[case_id])
                  return out
              if isinstance(doc, list):
                  return [enrich_row(r) for r in doc]
              if isinstance(doc, dict):
                  out = dict(doc)
                  for key in row_kinds:
                      if isinstance(out.get(key), list):
                          out[key] = [enrich_row(r) for r in out[key]]
                  return out
              return doc

          evidence_dir = os.environ["EVIDENCE_DIR"]
          for name, val in (("POLICY_DIGEST", os.environ.get("POLICY_DIGEST")),
                            ("COMPILED_SCOPE_DIGEST", os.environ.get("COMPILED_SCOPE_DIGEST")),
                            ("REQUIRED_INVARIANT_IDS", os.environ.get("REQUIRED_INVARIANT_IDS")),
                            ("PROMOTED_REFUSAL_CLASS_IDS", os.environ.get("PROMOTED_REFUSAL_CLASS_IDS"))):
              if not val:
                  raise SystemExit("missing required input: %s" % name)
          required_invariants = sorted({x for x in os.environ["REQUIRED_INVARIANT_IDS"].split(",") if x})
          promoted_classes = sorted({x for x in os.environ["PROMOTED_REFUSAL_CLASS_IDS"].split(",") if x})
          if not required_invariants or not promoted_classes:
              raise SystemExit("U1_REQUIRED_EVIDENCE_MISSING: empty invariant or refusal-class set")

          store = {"files": {}, "artifacts": [], "logicalIds": set()}
          origins = {}

          # ---- FK-P17-shaped evidence feed (IA-10 mapping) ----
          feed = []

          def feed_file(name, kind, logical, row_kinds):
              p = os.path.join(evidence_dir, name)
              with open(p, "rb") as f:
                  raw = f.read()
              if len(raw) > LIMITS["artifact"]:
                  raise LimitExceeded("U1_EVIDENCE_LIMIT_EXCEEDED: artifact > 8 MiB: %s" % p)
              origin = feed_origin(p)
              origins[p] = origin
              if name.endswith(".json"):
                  obj = load_json(p, raw)
                  doc = enrich_rows(obj, origin, p, raw, row_kinds)
                  raw = canon(doc)
              rel = "evidence/%s/%s" % (kind, logical + (".json" if name.endswith(".json") else ".jsonl"))
              check_package_path(rel)
              store["files"][rel] = raw
              art = add_artifact(store, rel, kind, logical,
                                 "application/json" if name.endswith(".json") else "application/x-ndjson", raw)
              feed.append(art)
              return art, obj if name.endswith(".json") else None

          observation_arts = []
          art, _ = feed_file("matrix.json", "observation", "matrix", ("rows", "cases"))
          observation_arts.append(art)
          for n, logical in (("summary.json", "run-summary"), ("manifest.json", "run-manifest"),
                             ("measurement-summary.json", "measurement-summary")):
              art, _ = feed_file(n, "execution-provenance" if n in ("summary.json", "manifest.json")
                                    else "observation", logical, ("rows", "cases", "gapRecords"))
              observation_arts.append(art)
          for p in sorted(_glob.glob(os.path.join(evidence_dir, "vectors", "V*.json"))):
              base = os.path.basename(p)[:-5].lower()
              with open(p, "rb") as f:
                  raw = f.read()
              origin = feed_origin(p)
              origins[p] = origin
              obj = load_json(p, raw)
              doc = enrich_rows(obj, origin, p, raw, ("cases", "rows"))
              raw = canon(doc)
              rel = "evidence/observation/%s.json" % base
              check_package_path(rel)
              store["files"][rel] = raw
              observation_arts.append(add_artifact(store, rel, "observation", base,
                                                   "application/json", raw))
          if os.path.exists(os.path.join(evidence_dir, "measurements.jsonl")):
              feed_file("measurements.jsonl", "observation", "measurements", ("rows",))
          ctl_art, _ = feed_file("controls.json", "negative-control", "controls", ("cases", "controls", "rows"))

          # A-U1.8.23 clause 5: the producer-side separation probes, run by the producer-probe
          # job (producer identity) and packaged as a producer-authored corroborating record.
          probe_path = "probe-in/producer-probes.json"
          with open(probe_path, "rb") as f:
              probe_raw = f.read()
          probe_doc = load_json(probe_path, probe_raw)
          write_artifact(store, "evidence/separation-probe/producer-probes.json", "separation-probe",
                         "producer-probes", probe_doc)

          # F-11: the aggregate evidenceOrigin literal names the TRUE origin of the feed.
          # A mixed feed cannot be named by one literal without mislabelling -> refuse.
          distinct = sorted(set(origins.values()))
          if len(distinct) != 1:
              raise SystemExit("U1_PROVENANCE_INVALID: mixed evidence origin %s cannot be named by one literal"
                               % distinct)
          evidence_origin = distinct[0]

          # ---- Generated contract artifacts ----
          commit = os.environ.get("GITHUB_SHA", "")
          tree_bytes = subprocess.run(["git", "ls-tree", "-r", "HEAD"], capture_output=True,
                                      check=True).stdout
          source = {"repositoryId": REPOSITORY_ID, "commit": commit, "treeDigest": tag(tree_bytes)}
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          execution = {"provider": "github-actions", "repositoryId": REPOSITORY_ID,
                       "workflowId": "u1-produce", "runId": run_id, "attempt": int(run_attempt),
                       "jobId": os.environ.get("GITHUB_JOB", ""),
                       "workflowRef": os.environ.get("GITHUB_WORKFLOW_REF", ""),
                       "headSha": commit,
                       "event": os.environ.get("GITHUB_EVENT_NAME", "")}

          write_artifact(store, "evidence/producer-identity/producer-identity.json", "producer-identity",
                         "producer-identity", {
                             "selfDeclaredName": "fk-p18-prime-producer",
                             "authenticatedPrincipal": {
                                 "kind": "azure-managed-identity",
                                 "clientId": "dc152b9d-c74e-4af1-aeeb-c23b95c68ab2",
                                 "federatedSubject": "repo:m0r6aN/agent-skills:environment:u1-producer",
                                 "roleAssignment": "Storage Blob Data Contributor (container u1-evidence, runs/* prefix)",
                                 "issuanceScope": "GitHub OIDC, per-run, environment-gated"},
                             "evidenceOrigin": evidence_origin,
                             "evidenceOriginPerFeed": [{"path": k, "origin": v}
                                                       for k, v in sorted(origins.items())],
                             "execution": execution})
          write_artifact(store, "evidence/action-inputs/action-inputs.json", "action-inputs", "action-inputs", {
              "actions": [
                  {"uses": "actions/checkout", "revision": "11d5960a326750d5838078e36cf38b85af677262",
                   "resolvedInputs": {"persist-credentials": False}},
                  {"uses": "actions/upload-artifact", "revision": "ea165f8d65b6e75b540449e92b4886f43607fa02",
                   "resolvedInputs": {"if-no-files-found": "error"}},
                  {"uses": "actions/download-artifact", "revision": "d3f86a106a0bac45b974a628896c90dbdf5c8093",
                   "resolvedInputs": {}},
                  {"uses": "azure/login", "revision": "7184910d9eb2b1c5e48f7073824a90609bb9b6d6",
                   "resolvedInputs": {"client-id": "dc152b9d-c74e-4af1-aeeb-c23b95c68ab2",
                                      "tenant-id": "ac08e2fd-34bf-4c87-a34f-c8c853ffc5e2",
                                      "subscription-id": "909e0322-c3c0-4bce-ae53-b3d2ed735bd4"}}]})
          az_version = None
          try:
              az_version = json.loads(subprocess.run(["az", "version"], capture_output=True,
                                                     text=True, check=True).stdout).get("azure-cli")
          except Exception:
              az_version = None
          write_artifact(store, "evidence/toolchain/toolchain.json", "toolchain", "toolchain", {
              "runner": {"labels": ["ubuntu-24.04"], "group": "github-hosted",
                         "runnerName": os.environ.get("RUNNER_NAME", ""),
                         "runnerOs": os.environ.get("RUNNER_OS", ""),
                         "runnerArch": os.environ.get("RUNNER_ARCH", ""),
                         "imageOS": os.environ.get("ImageOS", ""),
                         "imageVersion": os.environ.get("ImageVersion", "")},
              "runtime": {"python": subprocess.run(["python3", "--version"], capture_output=True,
                                                   text=True).stdout.strip(),
                          "azCliVersion": az_version},
              "dependencyLocks": [],
              "runnerIdentityGranularity": {
                  "reason": "hosted-runner image digest is not exposed to jobs",
                  "exception": "INF-4 exception per 3.3.4: hosted ubuntu-24.04 accepted at label level",
                  "compensatingRecords": ["imageOS", "imageVersion", "runnerName",
                                          "runnerOs", "runnerArch", "azCliVersion"],
                  "consequence": "limitation recorded (INCOMPLETE-U1-17 closure criterion A-U1.8.12)"}})
          write_artifact(store, "evidence/image/image.json", "image", "image", {
              "status": "not-used",
              "typedReason": "U1 CI runs on hosted runner images directly; no OCI container is promoted",
              "requiredImageIdentities": []})
          write_artifact(store, "evidence/configuration/configuration.json", "configuration", "configuration", {
              "workflowPath": ".github/workflows/u1-produce.yml",
              "credentialEnvelope": {"kind": "oidc-federated", "retainedCredential": None},
              "network": {"egress": "github-hosted default", "azureDataPlane": "TLS1.2+, OAuth"},
              "environmentAllowlist": ["u1-producer"],
              "attestation": {"requested": False,
                              "gap": "INCOMPLETE-U1-18 not issued by the selected workflows"},
              "mutableExternalVariables": [{"name": "inputs.evidence-dir", "value": os.environ.get("EVIDENCE_DIR", "")}]})
          write_artifact(store, "evidence/enforcement-environment/enforcement-environment.json",
                         "enforcement-environment", "enforcement-environment", {
                             "hostIdentity": {"runnerLabels": ["ubuntu-24.04"],
                                              "runnerName": os.environ.get("RUNNER_NAME", ""),
                                              "imageOS": os.environ.get("ImageOS", ""),
                                              "imageVersion": os.environ.get("ImageVersion", "")},
                             "pinnedImageToolPolicyConfigurationDigests": {
                                 "u1-produce.yml": tag(open(".github/workflows/u1-produce.yml", "rb").read()) if
                                     os.path.exists(".github/workflows/u1-produce.yml") else None},
                             "note": "D20 host capability record; prepared before FK-P19"})
          write_artifact(store, "evidence/independence-model/independence-model.json", "independence-model",
                         "independence-model", {
                             "perInvariantOwnership": {
                                 i: {"verifier": "u1-verify read-back + independent derivation",
                                     "oracle": "coordinator-owned expected-outcome oracle record (A-U1.8.04)"}
                                 for i in required_invariants},
                             "builderControlledInputs": [
                                 {"input": "evidence/** (FK-P17 harness output)", "failureConsequence": "U1_ARTIFACT_INVALID"},
                                 {"input": "generated manifest artifacts", "failureConsequence": "U1_PROVENANCE_INVALID"}],
                             "sharedDependencies": [{"component": "canonical-JSON encoder (embedded in both workflows)",
                                                     "note": "byte-identical copy per workflow; each pinned by its workflow file digest"}],
                             "runnerLifecycle": "github-hosted, one job per run, fresh VM",
                             "trustRoots": ["GitHub OIDC issuer token.actions.githubusercontent.com",
                                            "Entra tenant ac08e2fd-34bf-4c87-a34f-c8c853ffc5e2"],
                             "changeControl": "workflow files custodian-protected (CODEOWNERS + ruleset + pin record)",
                             "hostileInputExposure": "producer parses FK-P17 files as data (strict, linear); no candidate execution"})
          write_artifact(store, "evidence/retention-plan/retention-plan.json", "retention-plan", "retention-plan", {
              "destination": {"provider": "azure-blob", "tenant": "ac08e2fd-34bf-4c87-a34f-c8c853ffc5e2",
                              "subscription": "909e0322-c3c0-4bce-ae53-b3d2ed735bd4",
                              "resourceGroup": "biostack-rg", "account": "bs2jhgwvduljfdwdp",
                              "container": "u1-evidence"},
              "custodian": {"identity": "morganclint76@gmail.com", "objectId": "461a4112-8e91-41cb-afef-6889b8f48ff0"},
              "authorizedReaders": [{"identity": "u1-verifier-mi",
                                     "clientId": "ec2d02e3-904c-4ce2-9771-cd518d711e3f",
                                     "roleAssignment": "Storage Blob Data Reader + create-only u1-verifier-evidence-creator"}],
              "retention": {"mode": "time-based-immutability", "intervalDays": 400,
                            "state": "producer-authored plan only: never an observation (7.7); the verifier observes Locked/interval live"},
              "deletionPolicy": "none-permitted-during-retention",
              "retrievalMethod": "az storage blob download --auth-mode login (OAuth, no shared keys)",
              "lastRetrievalCheck": {"record": "U1-observations-2026-09-30.md retrieval test 2026-09-30",
                                     "digest": "sha256:802d413ae32f2905a56388e178b59c642f7e61f5cd7f30be5cfbef605c9aa530"}})

          # code-input artifacts: retained bytes of the source-bound workflow code
          for wf, logical in ((".github/workflows/u1-produce.yml", "workflow-produce"),
                              (".github/workflows/u1-verify.yml", "workflow-verify")):
              if os.path.exists(wf):
                  rel = "evidence/code-input/%s.yml" % logical
                  check_package_path(rel)
                  raw = open(wf, "rb").read()
                  store["files"][rel] = raw
                  add_artifact(store, rel, "code-input", logical, "application/yaml", raw)
                  store.setdefault("codeInputs", []).append(
                      {"logicalId": logical, "source": source, "path": rel, "digest": tag(raw)})

          # ---- bundle.json ----
          def slot(name):
              for a in store["artifacts"]:
                  if a["logicalId"] == name:
                      return a
              raise KeyError(name)

          bundle = {
              "schemaVersion": SCHEMA,
              "subject": {
                  "candidate": source,
                  "contractDigest": CONTRACT_DIGEST,
                  "policyDigest": os.environ["POLICY_DIGEST"],
                  "compiledScopeDigest": os.environ["COMPILED_SCOPE_DIGEST"],
                  "enforcementEnvironmentManifest": slot("enforcement-environment"),
                  "requiredInvariantIds": required_invariants,
                  "promotedRefusalClassIds": promoted_classes},
              "execution": execution,
              "producerIdentity": slot("producer-identity"),
              "verifierCode": [c for c in store.get("codeInputs", []) if c["logicalId"] == "workflow-verify"],
              "workflowCode": [c for c in store.get("codeInputs", []) if c["logicalId"] == "workflow-produce"],
              "actionInputs": slot("action-inputs"),
              "toolchainManifest": slot("toolchain"),
              "imageManifest": slot("image"),
              "configurationManifest": slot("configuration"),
              "independenceModel": slot("independence-model"),
              "executionProvenance": [a for a in store["artifacts"] if a["logicalId"] in ("run-summary", "run-manifest")],
              "observations": observation_arts,
              "negativeControls": [ctl_art],
              "retentionPlan": slot("retention-plan"),
              "artifactInventory": sorted(store["artifacts"], key=lambda a: a["relativePath"])}
          bundle_raw = canon(bundle)
          if len(bundle_raw) > LIMITS["bundle"]:
              raise LimitExceeded("U1_EVIDENCE_LIMIT_EXCEEDED: bundle > 64 MiB")
          total = len(bundle_raw) + sum(len(b) for b in store["files"].values())
          if total > LIMITS["bundle"]:
              raise LimitExceeded("U1_EVIDENCE_LIMIT_EXCEEDED: total package > 64 MiB")
          if len(store["artifacts"]) + 1 > LIMITS["count"]:
              raise LimitExceeded("U1_EVIDENCE_LIMIT_EXCEEDED: > 256 artifacts")

          os.makedirs("out/package", exist_ok=True)
          with open("out/package/bundle.json", "wb") as f:
              f.write(bundle_raw)
          for rel, raw in store["files"].items():
              dest = os.path.join("out/package", *rel.split("/"))
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              with open(dest, "wb") as f:
                  f.write(raw)
          manifest = {"bundleByteDigest": tag(bundle_raw),
                      "bundleDocDigest": doc_digest("foreman-line.u1.bundle", bundle),
                      "artifactCount": len(store["artifacts"]) + 1,
                      "totalBytes": total,
                      "evidenceOrigin": evidence_origin,
                      "limits": {"bundle": LIMITS["bundle"], "artifact": LIMITS["artifact"],
                                 "count": LIMITS["count"], "depth": LIMITS["depth"]}}
          with open("out/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, sort_keys=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("bundle-byte-digest=%s\n" % manifest["bundleByteDigest"])
              f.write("bundle-doc-digest=%s\n" % manifest["bundleDocDigest"])
              f.write("artifact-count=%s\n" % manifest["artifactCount"])
              f.write("evidence-origin=%s\n" % evidence_origin)
          print("packaged: %s bytes, %s objects, evidenceOrigin %s"
                % (total, manifest["artifactCount"], evidence_origin))
          PYEOF
      - name: Upload package handoff artifact (transport copy, not the retained store)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: u1-producer-package-${{ github.run_id }}
          path: out/package
          if-no-files-found: error
      - name: Summary
        env:
          BUNDLE_BYTE_DIGEST: ${{ steps.package.outputs.bundle-byte-digest }}
          BUNDLE_DOC_DIGEST: ${{ steps.package.outputs.bundle-doc-digest }}
          ARTIFACT_COUNT: ${{ steps.package.outputs.artifact-count }}
          EVIDENCE_ORIGIN: ${{ steps.package.outputs.evidence-origin }}
        run: |
          {
            echo '### u1-produce assemble'
            echo "- bundle byte digest: $BUNDLE_BYTE_DIGEST"
            echo "- bundle doc digest: $BUNDLE_DOC_DIGEST"
            echo "- objects: $ARTIFACT_COUNT"
            echo "- evidenceOrigin: $EVIDENCE_ORIGIN"
          } >> "$GITHUB_STEP_SUMMARY"

  submit:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: u1-producer
    permissions:
      id-token: write
      contents: read
    outputs:
      uploaded-count: ${{ steps.upload.outputs.uploaded-count }}
      producer-prefix: ${{ steps.upload.outputs.producer-prefix }}
    steps:
      - name: Download package handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: u1-producer-package-${{ github.run_id }}
          path: package
      - name: Azure login (OIDC -> u1-producer-mi)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: dc152b9d-c74e-4af1-aeeb-c23b95c68ab2
          tenant-id: ac08e2fd-34bf-4c87-a34f-c8c853ffc5e2
          subscription-id: 909e0322-c3c0-4bce-ae53-b3d2ed735bd4
      - name: Upload run-qualified blobs under runs/<runId>/p<NN>/ (overwrite refused)
        id: upload
        run: |
          set -euo pipefail
          ATTEMPT_POS="$(printf 'p%02d' "$GITHUB_RUN_ATTEMPT")"
          PREFIX="u1/m0r6an/agent-skills/runs/${GITHUB_RUN_ID}/${ATTEMPT_POS}"
          COUNT=0
          while IFS= read -r -d '' f; do
            rel="${f#package/}"
            case "$rel" in
              audit/*|verifications/*|attempt-ledger/*)
                echo "refusing object outside the producer namespace: $rel" >&2
                exit 1 ;;
            esac
            name="$PREFIX/$rel"
            # IA-9: overwriting an existing object name is refused -> IA-7.3 on collision.
            az storage blob upload \
              --account-name bs2jhgwvduljfdwdp --container-name u1-evidence \
              --name "$name" --file "$f" --auth-mode login --overwrite false \
              --content-type application/octet-stream --output none
            COUNT=$((COUNT+1))
          done < <(find package -type f -print0 | sort -z)
          echo "uploaded-count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "producer-prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "### u1-produce submit: $COUNT objects at $PREFIX/ (overwrite=false; no policy/delete commands)" >> "$GITHUB_STEP_SUMMARY"
