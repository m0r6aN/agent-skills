# AC10 accept: `profile: none` proceeds (charter §6.10's accept half).
# Declaring "no UI stack" is an explicit act; layout and surfaces_present
# are prohibited alongside it (Q5 ruling) and correctly absent here.
identity:
  project_key: LIB
  base_branch: main
  branch_prefix: feat/
  worktree_root: ../worktrees
  dispatch_queue: lib-dispatch

stack:
  profile: none

capabilities: {}

policy:
  audit:
    require_security_audit_at: [elevated, critical]
