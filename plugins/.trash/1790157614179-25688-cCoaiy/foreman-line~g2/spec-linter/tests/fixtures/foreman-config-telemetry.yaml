# P1a AC4 fixture: a VALID foreman/config.yaml whose `capabilities:` declares
# the non-canonical key `telemetry`, extending the §4.8 involves vocabulary
# (resolution order, step 2). Passed to the spec-linter EXPLICITLY via
# `--config <path>` — there is no implicit lookup. This is a test fixture,
# not a live config (Constraint 9: the repo's own config is P6's).
identity:
  project_key: KONE
  base_branch: main
  branch_prefix: feat/
  worktree_root: ../worktrees
  dispatch_queue: foreman-line-dispatch

stack:
  profile: vite-react-ts-tailwind
  layout:
    route_roots: ["src"]
    style_roots: ["src"]
    component_roots: ["src/components"]
    theme_files: ["src/index.css"]
    ui_primitives: ["src/components/ui"]
  surfaces_present: []

capabilities:
  telemetry: [otel-instrument]

policy:
  audit:
    require_security_audit_at: [elevated, critical]
