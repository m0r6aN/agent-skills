<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foreman Ops Console — control center</title>
  <style>
    :root {
      --bg: #0f1420; --panel: #171e2e; --panel2: #1d2639; --text: #e6ecf7; --muted: #93a1b8;
      --line: #2a3550; --accent: #5aa2ff; --ok: #37c978; --warn: #f2b63d; --bad: #f2545b; --gate: #b98cff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    /* FCA-P6 full-viewport control-center grid: header, rail, dense main,
       persistent spawn panel, collapsible session tray. The page itself never
       scrolls; panels scroll internally (density baseline). */
    body {
      margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif;
      height: 100vh; overflow: hidden;
    }
    #app {
      height: 100vh;
      display: grid;
      grid-template-areas:
        "header header header"
        "rail   main   spawn"
        "tray   tray   tray";
      grid-template-rows: auto 1fr auto;
      grid-template-columns: minmax(160px, 200px) 1fr minmax(280px, 340px);
    }
    header { grid-area: header; display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 17px; margin: 0; }
    nav.rail { grid-area: rail; border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; }
    main { grid-area: main; padding: 12px 14px; overflow-y: auto; }
    aside.spawn { grid-area: spawn; border-left: 1px solid var(--line); padding: 10px 10px; overflow-y: auto; }
    footer.tray { grid-area: tray; border-top: 1px solid var(--line); padding: 6px 12px; }
    footer.tray #tray-body { max-height: 30vh; overflow-y: auto; }
    .nav-btn { display: block; width: 100%; text-align: left; margin: 2px 0; }
    .nav-btn.active { border-color: var(--accent); color: var(--accent); }
    .rail-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 12px 0 4px; }
    .filter { display: block; color: var(--muted); font-size: 12px; margin: 2px 0; }
    .fleet-switch { color: var(--muted); font-size: 12px; }
    #global-search { min-width: 220px; }
    /* A11y floor: every interactive control shows a focus ring. */
    button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible,
    .card:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    select, button, input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    /* The attention banner spans the board grid instead of stealing a column. */
    #board > .banner { grid-column: 1 / -1; }
    .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 120px; }
    .col h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; }
    .col.running h2 { color: var(--ok); } .col.hung h2 { color: var(--warn); }
    .col.awaiting-gate h2 { color: var(--gate); } .col.failed h2 { color: var(--bad); }
    .col.complete h2 { color: var(--accent); }
    .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
    .card:hover { border-color: var(--accent); }
    .card .key { font-weight: 600; }
    .card .meta { color: var(--muted); font-size: 12px; }
    /* FCA-2 attention treatment: cards that need the human stand out. */
    .card.needs-red { border-left: 3px solid var(--bad); }
    .card.needs-red:hover { border-color: var(--bad); }
    .card.needs-amber { border-left: 3px solid var(--gate); }
    .card.needs-amber:hover { border-color: var(--gate); }
    .chip { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; vertical-align: middle; }
    .chip-red { color: var(--bad); border: 1px solid var(--bad); }
    .chip-amber { color: var(--gate); border: 1px solid var(--gate); }
    .banner { background: color-mix(in srgb, var(--bad) 14%, transparent); border: 1px solid var(--bad); color: var(--text); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-weight: 600; }
    .banner-inline { color: var(--warn); font-weight: 600; }
    optgroup { font-weight: 600; }
    /* FCA-3 remediation advisor: question + answer branches with commands. */
    .remedy { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
    .remedy summary { cursor: pointer; font-weight: 600; }
    .remedy-q { margin: 8px 0 6px; font-weight: 600; color: var(--accent); }
    .remedy-opt { border-left: 2px solid var(--line); padding: 4px 10px; margin: 6px 0; }
    .remedy-a { font-weight: 600; }
    pre.cmd { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 4px 0; font-size: 12px; user-select: all; }
    .flags { color: var(--warn); font-size: 11px; }
    section { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    section h2 { margin: 0 0 10px; font-size: 15px; }
    main > section[data-view] { margin-top: 0; border: 0; padding: 0; background: transparent; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 320px; font-size: 12px; }
    a { color: var(--accent); text-decoration: none; }
    .pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11px; border: 1px solid var(--line); }
    .pill.evidenced { color: var(--ok); border-color: var(--ok); }
    .pill.pending { color: var(--warn); border-color: var(--warn); }
    .pill.unknown { color: var(--muted); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
