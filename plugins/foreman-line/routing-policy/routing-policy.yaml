# ---------------------------------------------------------------------------
# RCM schema v0.4 (RCM-P3/RCM-P9) — expertise bindings.
#
# Shipped EMPTY on purpose: actual binding content is RCM-P9's, must be
# proposed shadow/evidence-only (each with a cited, dated source and explicit
# admissibility statement), and any promotion to a dispatch default is human
# Gate 3 — explicitly out of the RCM goal. Semantics (D3/OQ2, enforced by the
# validator and the resolver): a non-shadow entry narrows the already-eligible
# set within its routing class and expertise area; missing bindings never
# invent a preference; an unsatisfiable binding refuses rather than silently
# falling back; shadow entries are evidence-only and never route.
expertise_bindings: []
