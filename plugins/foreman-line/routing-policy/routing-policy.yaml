  # -------------------------------------------------------------------------
  # Amendment 06 N3 — open-weight / open-source lane on `fireworks`.
  #
  # Every fact below is transcribed from the on-host catalogue capture
  # (`~/.pi/agent/models-store.json`, 2026-10-07T09:21:58Z); `pi auth check
  # --provider fireworks` reported `ready` at capture time.
  #
  # Three things about this block are deliberate and load-bearing:
  #
  #  1. ID SPELLING. Fireworks ids are full `accounts/fireworks/models/<id>`
  #     paths in which `p` stands in for a decimal point (`glm-5p3` IS GLM 5.3).
  #     That is a THIRD spelling convention alongside the dashed Pi ids and the
  #     dotted OpenRouter slugs. It is recorded verbatim and never normalized
  #     toward either (N1/N3) — the binding id is `fireworks/` + that path.
  #
  #  2. PUBLIC ONLY. `data_classes` is `[public]` for every entry. Invariant (g)
  #     demands `data_collection: deny` + `zdr: true` for internal/restricted,
  #     and the capture establishes neither for an inference host that is not
  #     the model's author. Residual: FIREWORKS_TRANSPORT_UNVERIFIED (N6).
  #     Do not widen these lists without transport evidence.
  #
  #  3. NO ROUTERS. `accounts/fireworks/routers/*` aggregator ids are excluded
  #     on purpose: a router re-dispatches to an unnamed upstream, which
  #     defeats the executed-identity check the receipt chain depends on.
  #
  # `opencode-go` has NO candidate here. It is a declared provider (types.ts
  # PROVIDER_NAMES) that is `not_ready` on this host and absent from the
