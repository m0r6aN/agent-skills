# Foreman Line — Model Routing Policy (v0.4 — RCM schema v0.4: per-entry
# capability predicates `inputs`/`thinking_levels` and the `expertise_bindings`
# block, per RCM-P2/RCM-P3; see docs/goals/routing-currency-and-merit/)
#
# Concrete September-2026 instantiation of plan §5 against the OpenRouter
# catalog (https://openrouter.ai/api/v1/models). Model ids are OpenRouter slugs
# verbatim — `vendor/model`, and Anthropic ids use DOTS here
# (`anthropic/claude-fable-5.1`), the opposite of OpenCode Zen's dashes. The
# consumer prepends its own provider prefix (e.g. `openrouter/`), exactly as it
# prepended `opencode/` to the v0.2 Zen ids. Revisit quarterly — model pricing
# and capability change faster than this document should be treated as
# permanent. See routing-policy/README.md for the schema shape, the exit-code
# contract, and the invariants the validator enforces.
#
# Prices noted below are OpenRouter list prices per 1M tokens (input / output)
# on 2026-09-03, informational only; ceilings are the enforced bound.
# OpenRouter adds a fee on credit purchases (~5.5%), not per token.

classes:
  boilerplate:
    # Mechanical fixes and build-fix-loop don't deserve Sonnet tokens.
    allowlist: [economy]
    ceiling_usd: 0.50
  standard-feature:
    allowlist: [standard]
    ceiling_usd: 5.00
  architecture/risk:
    # W0 contract work routes frontier per policy (same reasoning as W0-P1).
    allowlist: [frontier]
    ceiling_usd: 25.00
  implementation/standard:
    # Scaffold work; no frontier routing required (the class PCC-P0 used).
    allowlist: [standard]
    ceiling_usd: 5.00

data_classification:
  # OpenRouter is a multi-provider gateway: one model id may be served by many
  # upstream hosts (Anthropic/Bedrock/Vertex/Azure for Claude; a dozen-plus
  # third parties for open-weight models) with different retention and
  # training policies, load-balanced by price unless told otherwise. A model
  # id therefore does NOT determine who sees the prompt. Two request-level
  # controls do — `provider.data_collection` and `provider.zdr` — and this
  # repository never sends requests. `transport_requirements` declares what
  # the consumer MUST send per classification (invariant g requires the
  # strict values for internal and restricted); it does not enforce it.
  #
  # Recommended companion setting, outside this repo: in OpenRouter's privacy
  # settings, disable providers that train on inputs and enable ZDR
  # enforcement for the Anthropic / OpenAI / Google groups account-wide. That
  # makes the strict values below the fail-closed default for every request
  # regardless of classification. v0.3 prefers first-party-lab-served ids
  # (every such id has ZDR-capable endpoints); the Nemotron 3.5 Lightning
  # entry is the documented exception (third-party-served on OpenRouter —
  # see its tier note), carried under the same strict declared requirements.
  #
  # v0.2's public-only free Meta contributor model is gone. On OpenRouter it
  # costs $0.10 / $0.20 rather than $0, Meta still trains on it, and the
  # public-vs-non-public boundary would now be enforced only by the consumer
  # honoring `transport_requirements` — an unverifiable dependency this
  # policy's "declared + derived, never somehow" stance rejects. OpenRouter's
  # `:free` variants are likewise excluded: daily request caps plus a
  # first-eligible dispatcher with no runtime fallback means quota exhaustion
  # fails the task outright.
  #
  # Classification gating is evaluated before cost optimization (D6):
  # data-class eligibility is declared per binding (`candidates` ->
  # `data_classes`, A5.2) and must narrow monotonically (restricted implies
  # internal implies public).
  public:
    transport_requirements:
      # Public inputs may reach any provider; still recommend the strict
      # account-wide setting so this is never load-bearing.
      data_collection: allow
      zdr: false
  internal:
    transport_requirements:
      data_collection: deny # required by invariant (g)
      zdr: true # required by invariant (g)
  restricted:
    transport_requirements:
      data_collection: deny # required by invariant (g)
      zdr: true # required by invariant (g)

selection_order:
  # Ordered selection source (C5.2) — migrated at CUTOVER-P4 from the removed
  # `model_tiers` block. Entries are provider-neutral candidate keys with
  # referential integrity to `candidates`; a model's OpenRouter slug lives only
  # in its binding's `model` field (never as a bare policy entry). Tier-group
  # vocabulary below `frontier` is policy content and is revisable quarterly;
  # `frontier` is the one literal name the validator's invariants depend on —
  # do not rename it. Every `frontier` entry must resolve to a
  # KNOWN_FRONTIER_MODELS id (src/validator.ts).
  #
  # ORDER IS THE SELECTION RULE. The dispatcher (dispatch/src/routing-eval)
  # walks the class allowlist groups in order and, within each group, picks the
  # FIRST candidate that is eligible under the task's data classification.
  # There is no price comparison at dispatch time — cost optimization is
  # expressed entirely by how these lists are ordered.
  frontier:
    # Coordinator, Adversarial Reviewer, and the security-audit hard override.
    # Two vendors on purpose: a verifier drawn from a different vendor than the
    # coordinator makes distinct-instance independence more than nominal.
    - claude-opus-5-5 # anthropic/claude-opus-5.5 — confirmed Opus 5.5 frontier route
    - gpt-5.6-sol # openai/gpt-5.6-sol — preferred verifier
    - gemini-3.1-pro-preview # google/gemini-3.1-pro-preview — third-vendor fallback (no GA slug on OpenRouter)
    - claude-fable-5.1 # anthropic/claude-fable-5.1 — escalation only; 2x Opus 5
    - gpt-6-astra # openai/gpt-6-astra — newest escalation, after Fable (SUPERCHARGE-P1, verified 2026-09-14)
  standard:
    # Builder default. Gemini 3.8 Flash is half its Zen price on OpenRouter
    # and sits second on price; Sonnet 5 stays first on track record.
    - claude-sonnet-5 # anthropic/claude-sonnet-5
    - gemini-3.8-flash # google/gemini-3.8-flash
    - gpt-5.6-terra # openai/gpt-5.6-terra
    # SUPERCHARGE-P1 appends (verified 2026-09-14; end-append preserves
    # first-eligible selection for all existing class/classification pairs):
    - glm-5.3 # z-ai/glm-5.3
    - grok-4.6 # x-ai/grok-4.6
    - muse-spark-1.3 # meta/muse-spark-1.3
  economy:
    # Boilerplate / build-fix-loop. First eligible wins; Nemotron stays first
    # so it is actually selected in all three declared classifications.
    # Later entries are eligibility alternatives, not health/quota failover.
    # Nemotron 3.5 Lightning (BF16 weights lineage), NVIDIA 30B-A3B open MoE
    # (3B active), reasoning-capable sub-agent workhorse. NOTE: on OpenRouter
    # it is served by third parties only (no first-party NVIDIA endpoint at
    # time of listing) — non-public use rides entirely on the declared
    # transport_requirements below plus the account-wide privacy settings.
    - nemotron-3.5-lightning # nvidia/nemotron-3.5-lightning
    - gpt-5.6-luna # openai/gpt-5.6-luna
    - gemini-3.1-flash-lite # google/gemini-3.1-flash-lite
    - claude-haiku-4.5 # anthropic/claude-haiku-4.5

# Shadow routes are advisory sidecars for explicitly public, non-authoritative
# analysis (spec_lint, evidence_index, review_triage). They are never model
# tiers and cannot fill coordinator, verifier, approval, gate, tool, or effect
# roles; the validator enforces that containment for any route declared here.
#
# v0.3 ships none. The former `cerebras-shadow` entry had no adapter, no
# credential, and no production caller behind it. On OpenRouter, fast
# inference (Cerebras, Groq) is a provider preference on an existing model id
# under the same credential, not a separate adapter — there is nothing left
# for a shadow route to add. The dispatch API (`executeShadowRoute`) and its
# invariants are retained; see tests/fixtures/accept-shadow-route.yaml for the
# shape of a valid route.
shadow_routes: {}

# ---------------------------------------------------------------------------
# PMC-P1 — provider-neutral fallback contract (charter A5.1–A5.5, A3).
#
# The sole representation since CUTOVER-P4 ended the A5.5 deprecation window:
# the legacy `model_tiers`/`roles`/`data_classification.eligible_models`
# blocks are removed (refused by name: LEGACY_REPRESENTATION_REFUSED), and the
# `compatibility.legacy_representation` record below is the ratified historical
# statement of what was removed and where removal was serialized.
#
# Layering (A5.1–A5.3):
#   logical layer  — `candidates` keyed by provider-neutral ids
#   binding layer  — provider-prefixed bindings (`opencode/...`,
#                    `openrouter/...`) attached to a candidate, carrying
#                    eligibility at the binding level
#   fallback       — explicit, typed references (`type: binding|candidate`);
#                    self-referential and dangling references are rejected
#
# Frozen role/lane/authority map (A5.4): `lane_map` encodes the six lanes of
# `pmc-p0-role-lane-map.md` as ratified by `a54-ratification-2026-09-26.md`.
# The L1/L2 pinned-provider values, the L3/L4 provider-preference values, and
# the per-lane quality tolerance delta_L are named unfabricated residuals
# (a54 dispositions 2/3/5): typed-unavailable, never silently defaulted.
# Their declared values are assignable only from real availability/model-quality
# evidence (A6) under a later, reviewed change.
#
# Evidence values follow one envelope shape everywhere:
#   { state: declared, value: <typed>, source: <named source of truth> }
#   { state: unknown|unverified|unproven, residual: <named refusal/hold> }
# No field asserts anything its named source does not establish (A6).
# ---------------------------------------------------------------------------
compatibility:
  representation: provider-neutral-fallback-contract
  version: 1
  legacy_representation:
    blocks: [model_tiers, roles, data_classification.eligible_models]
    id_vocabulary: openrouter-slug-only
    status: deprecated
    removal_serialized_into: PMC-P4

ranking_contract:
  # A3 / suitability rubric: the required eligibility/ranking fields (R1-R7)
  # and the evidence threshold, encoded. Values live on bindings and routes.
  inputs:
    R1: data-class eligibility
    R2: required capability
    R3: independence obligation
    R4: available context
    R5: remaining budget
    R6: verified availability
    R7: recorded quality score
  eligibility_filters: [R1, R2, R3, R4, R6]
  budget_ordering_lane: L5
  quality_ordering_key: R7
  stable_order: [declared-matrix-role, provider, model-id]
  evidence_threshold:
    rankable_requires: R1-R6-definite-true-from-a-named-source-and-R7-recorded-for-this-lane
    on_unknown: refuse # unrankable is never ranked last; unknown is never "comparable"
  attested_states: [static-conformance, live-availability, model-quality]

lane_map:
  L1:
    role_family: coordinator
    subroles: [coordinator, shaper, architect]
    routing_classes: [architecture/risk]
    authority_cap: [coordinate, shape, propose-amendment]
    authority_prohibited: [ratify, grant-gate, merge, release, self-verify]
    frontier_only: true
    independence: coordinator-is-never-its-own-verifier
    human_gates: [gate-1, gate-2, gate-3, break-glass-owner-only]
    provider_rule:
      kind: pinned-provider
      pinned_provider: { state: unavailable, residual: L1_PINNED_PROVIDER_UNSET }
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L2:
    role_family: verifier
    subroles: [adversarial-reviewer, verifier, security-auditor]
    routing_classes: [architecture/risk, review/security]
    authority_cap: [verdict, findings-recommendation]
    authority_prohibited: [approve, merge, release, edit-artifact, accept-own-findings]
    frontier_only: true
    independence: independent-family-from-builder-applies-to-primary-and-fallback
    human_gates: [coordinator-acceptance, gate-3]
    provider_rule:
      kind: pinned-provider
      pinned_provider: { state: unavailable, residual: L2_PINNED_PROVIDER_UNSET }
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L3:
    role_family: builder
    subroles: [builder-complex]
    routing_classes: [implementation/complex]
    authority_cap: [execution-within-allowed-files]
    authority_prohibited: [approve, merge, release, policy-bypass, self-review]
    frontier_only: false
    independence: reviewer-must-be-independent-family
    human_gates: [gate-2]
    provider_rule:
      kind: declared-preference
      preference: { state: unavailable, residual: L3_PROVIDER_PREFERENCE_UNSET }
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L4:
    role_family: builder
    subroles: [builder-standard]
    routing_classes: [standard-feature, implementation/standard]
    authority_cap: [execution-within-allowed-files]
    authority_prohibited: [approve, merge, release, policy-bypass, self-review]
    frontier_only: false
    independence: reviewer-independent-where-parcel-risk-requires
    human_gates: [gate-2]
    provider_rule:
      kind: declared-preference
      preference: { state: unavailable, residual: L4_PROVIDER_PREFERENCE_UNSET }
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L5:
    role_family: builder
    subroles: [builder-economy]
    routing_classes: [boilerplate]
    authority_cap: [execution-within-allowed-files]
    authority_prohibited: [security, approve, merge, release, final-verification]
    frontier_only: false
    independence: never-a-verifier
    human_gates: [gate-2]
    provider_rule:
      kind: cheapest-eligible
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L6:
    # M2: typed routing/classification is refused/disabled. No route may be
    # declared for L6 (validator: LANE_DISABLED_REFUSED); any re-enablement
    # requires a ratified amendment (rubric L6 resolution, rule 1).
    role_family: classifier
    subroles: [routing-classifier]
    routing_classes: [routing/classification]
    authority_cap: [recommend-only]
    authority_prohibited:
      [
        prose,
        implementation,
        review,
        approve,
        merge,
        verification,
        control-plane,
        promotion,
        cross-provider-fallback,
      ]
    frontier_only: false
    independence: not-applicable
    human_gates: [reattestation-by-ratified-amendment]
    provider_rule:
      kind: none
      refusal: LANE_DISABLED_REFUSED
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
    status: disabled-refused
    re_enablement: ratified-amendment-required
    re_enablement_candidates: [opencode/qwen3.8-flash, opencode/glm-5.3-flash]

