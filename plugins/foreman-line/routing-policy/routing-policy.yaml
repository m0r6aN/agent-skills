lane_routes:
  # One route per lane and provider, exactly as the charter matrix declares
  # (provider-local primary -> fallback; cross-provider failover is a new,
  # recorded attempt under D3, never a fallback). No L6 route exists: the lane
  # is refused/disabled (M2), and any declaration is rejected.
  # `comparability` is the rubric's "comparable or higher" verdict: it stays
  # typed-unproven while any comparison input (including delta_L) is
  # unavailable, per the evidence threshold.
  # Amendment 07 (2026-10-07): L1/L2 opencode re-pinning, owner-directed.
  # Both legs of each route are provider-local on the opencode gateway (D3);
  # identity/cost sourced to the models.dev capture, everything else
  # typed-unavailable per the amendment's evidence basis.
  - lane: L1
    provider: opencode
    primary: { type: binding, ref: opencode/gpt-6.1-sol }
    fallback: { type: binding, ref: opencode/claude-opus-5-5 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L1
    provider: openrouter
    primary: { type: binding, ref: openrouter/openai/gpt-6-astra }
    fallback: { type: binding, ref: openrouter/anthropic/claude-opus-5.5 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L2
    provider: opencode
    primary: { type: binding, ref: opencode/claude-sonnet-5-5 }
    fallback: { type: binding, ref: opencode/gpt-6-luna }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L2
    provider: openrouter
    primary: { type: binding, ref: openrouter/anthropic/claude-opus-5.5 }
    fallback: { type: binding, ref: openrouter/openai/gpt-6-astra }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L3
    provider: opencode
    # Amendment 08: gpt-6.1-sol replaces the struck 5.6-sol id (403
    # access-disabled on this host, probe O-2; equal price, newer generation).
    primary: { type: binding, ref: opencode/gpt-6.1-sol }
    fallback: { type: binding, ref: opencode/claude-sonnet-5 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L3
    provider: openrouter
    primary: { type: binding, ref: openrouter/anthropic/claude-sonnet-5 }
    fallback: { type: binding, ref: openrouter/openai/gpt-6.1-sol }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L4
    provider: opencode
    primary: { type: binding, ref: opencode/deepseek-v4-pro }
    fallback: { type: binding, ref: opencode/gpt-5.6-terra }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L4
    provider: openrouter
    primary: { type: binding, ref: openrouter/openai/gpt-5.6-terra }
    fallback: { type: binding, ref: openrouter/google/gemini-3.8-flash }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L5
    provider: opencode
    primary: { type: binding, ref: opencode/qwen3.8-flash }
    fallback: { type: binding, ref: opencode/glm-5.3-flash }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L5
    provider: openrouter
    primary: { type: binding, ref: openrouter/google/gemini-3.8-flash }
    fallback: { type: binding, ref: openrouter/anthropic/claude-haiku-4.5 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  # --- Amendment 06 N1: first-party `anthropic` routes. ---
  # These are what `pi --model anthropic/<id>` resolves against. Every fallback
  # is provider-local (D3) and declared here rather than inherited: N5 records
  # that `claude-fable-5-1` ships NO provider-side allowedFallbackModels.
  - lane: L1
    provider: anthropic
    primary: { type: binding, ref: anthropic/claude-opus-5-5 }
    fallback: { type: binding, ref: anthropic/claude-fable-5-1 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L2
    provider: anthropic
    # Verifier primary is Fable, so the L2 reviewer is a different model from the
    # L1 coordinator even inside one provider — independence stays more than
    # nominal (selection_order frontier note).
    primary: { type: binding, ref: anthropic/claude-fable-5-1 }
    fallback: { type: binding, ref: anthropic/claude-opus-5-5 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L3
    provider: anthropic
    primary: { type: binding, ref: anthropic/claude-sonnet-5-5 }
    fallback: { type: binding, ref: anthropic/claude-opus-5-5 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  # --- Amendment 06 N3 / probe 2026-10-07: `opencode-go` routes. ---
  # A DISTINCT provider from `opencode`, never an alias. Every leg is
  # provider-local (D3) and `public`-only (OPENCODE_GO_TRANSPORT_UNVERIFIED), so
  # no fallback widens its primary's data-class reach. No L1/L2 route: those
  # lanes are frontier-only and no opencode-go binding is in
  # KNOWN_FRONTIER_BINDINGS.
  #
  # The pre-existing `opencode` routes below are left exactly as they are. They
  # are unresolvable on the probe host (the provider is not configured there at
  # all), but that is a fact about one host, not about the contract.
  - lane: L3
    provider: opencode-go
    primary: { type: binding, ref: opencode-go/grok-4.6 }
    fallback: { type: binding, ref: opencode-go/kimi-k3 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L4
    provider: opencode-go
    primary: { type: binding, ref: opencode-go/glm-5.3 }
    fallback: { type: binding, ref: opencode-go/grok-4.6 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L5
    provider: opencode-go
    # qwen3.8-flash is the cheapest admitted opencode-go id ($0.15/$0.47) and is
    # the id whose absence under `opencode` produced the long-standing
    # AC2A_ZERO_MATCH. It resolves here, in its own namespace — which is the
    # confirmation of that diagnosis, not a reversal of the no-alias rule.
    primary: { type: binding, ref: opencode-go/qwen3.8-flash }
    fallback: { type: binding, ref: opencode-go/glm-5.3-flash }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  # --- Amendment 06 N3: open-weight `fireworks` routes. ---
  # L4/L5 only. There is deliberately NO fireworks route for L1/L2: those lanes
  # are `frontier_only` and no open-weight binding is in KNOWN_FRONTIER_BINDINGS.
  # Both legs of each route are public-only, so the fallback never widens the
  # primary's data-class reach.
  - lane: L4
    provider: fireworks
    primary: { type: binding, ref: fireworks/accounts/fireworks/models/qwen3p8-max }
    fallback: { type: binding, ref: fireworks/accounts/fireworks/models/glm-5p3 }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
  - lane: L5
    provider: fireworks
    primary: { type: binding, ref: fireworks/accounts/fireworks/models/nemotron-lightning-3p5-30b-a3b }
    fallback: { type: binding, ref: fireworks/accounts/fireworks/models/glm-5p3-flash }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }

# ---------------------------------------------------------------------------
# RCM schema v0.4 (RCM-P3/RCM-P9) — expertise bindings.
#
# Shipped EMPTY on purpose: actual binding content is RCM-P9's, must be
# proposed shadow/evidence-only (each with a cited, dated source and explicit
# admissibility statement), and any promotion to a dispatch default is human
# Gate 3 — explicitly out of the RCM goal. Semantics (D3/OQ2, enforced by the
# validator and the resolver): a non-shadow entry narrows the already-eligible
# set within its routing class and expertise area; missing bindings never
# invent a preference; an unsatisfiable binding refuses rather than silently
# falling back; shadow entries are evidence-only and never route.
expertise_bindings: []
