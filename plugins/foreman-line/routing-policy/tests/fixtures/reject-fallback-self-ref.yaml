# Rejecting fixture (PMC-P1, A5.3): the new provider-neutral fallback contract
# with exactly one contract violation — lane_routes[0].fallback references its
# own primary (self-referential). The frozen map pins (A5.4) and the
# post-cutover representation are otherwise satisfied, so the document isolates
# FALLBACK_SELF_REFERENCE. (Migrated at CUTOVER-P4: the legacy skeleton is
# gone; the ordered source and binding-level eligibility carry its role.)
classes:
  boilerplate:
    allowlist: [economy]
    ceiling_usd: 0.50
  standard-feature:
    allowlist: [standard]
    ceiling_usd: 5.00
  architecture/risk:
    allowlist: [frontier]
    ceiling_usd: 25.00
  implementation/standard:
    allowlist: [standard]
    ceiling_usd: 5.00

data_classification:
  public:
    transport_requirements: { data_collection: allow, zdr: false }
  internal:
    transport_requirements: { data_collection: deny, zdr: true }
  restricted:
    transport_requirements: { data_collection: deny, zdr: true }

selection_order:
  # Ordered source (C5.2): the fixture's only candidate anchors each group —
  # the (e)/(f) re-anchored invariants ride its OpenRouter binding, and the
  # document stays otherwise valid so the self-reference below is the single
  # violation.
  frontier: [alpha-model]
  standard: [alpha-model]
  economy: [alpha-model]

shadow_routes: {}

compatibility:
  representation: provider-neutral-fallback-contract
  version: 1
  legacy_representation:
    blocks: [model_tiers, roles, data_classification.eligible_models]
    id_vocabulary: openrouter-slug-only
    status: deprecated
    removal_serialized_into: PMC-P4

ranking_contract:
  inputs:
    R1: data-class eligibility
    R2: required capability
    R3: independence obligation
    R4: available context
    R5: remaining budget
    R6: verified availability
    R7: recorded quality score
  eligibility_filters: [R1, R2, R3, R4, R6]
  budget_ordering_lane: L5
  quality_ordering_key: R7
  stable_order: [declared-matrix-role, provider, model-id]
  evidence_threshold:
    rankable_requires: R1-R6-definite-true-from-a-named-source-and-R7-recorded-for-this-lane
    on_unknown: refuse
  attested_states: [static-conformance, live-availability, model-quality]

lane_map:
  L1:
    role_family: coordinator
    subroles: [coordinator]
    routing_classes: [architecture/risk]
    authority_cap: [coordinate]
    authority_prohibited: [ratify, grant-gate, merge, release]
    frontier_only: true
    independence: coordinator-is-never-its-own-verifier
    human_gates: [gate-2]
    provider_rule:
      kind: pinned-provider
      pinned_provider: { state: unavailable, residual: L1_PINNED_PROVIDER_UNSET }
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L2:
    role_family: verifier
    subroles: [verifier]
    routing_classes: [architecture/risk]
    authority_cap: [verdict]
    authority_prohibited: [approve, merge, release]
    frontier_only: true
    independence: independent-family-from-builder
    human_gates: [gate-2]
    provider_rule:
      kind: pinned-provider
      pinned_provider: { state: unavailable, residual: L2_PINNED_PROVIDER_UNSET }
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L3:
    role_family: builder
    subroles: [builder-complex]
    routing_classes: [implementation/complex]
    authority_cap: [execution-within-allowed-files]
    authority_prohibited: [approve, merge, release]
    frontier_only: false
    independence: reviewer-must-be-independent-family
    human_gates: [gate-2]
    provider_rule:
      kind: declared-preference
      preference: { state: unavailable, residual: L3_PROVIDER_PREFERENCE_UNSET }
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L4:
    role_family: builder
    subroles: [builder-standard]
    routing_classes: [standard-feature]
    authority_cap: [execution-within-allowed-files]
    authority_prohibited: [approve, merge, release]
    frontier_only: false
    independence: reviewer-independent-where-risk-requires
    human_gates: [gate-2]
    provider_rule:
      kind: declared-preference
      preference: { state: unavailable, residual: L4_PROVIDER_PREFERENCE_UNSET }
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L5:
    role_family: builder
    subroles: [builder-economy]
    routing_classes: [boilerplate]
    authority_cap: [execution-within-allowed-files]
    authority_prohibited: [security, approve, merge, release]
    frontier_only: false
    independence: never-a-verifier
    human_gates: [gate-2]
    provider_rule:
      kind: cheapest-eligible
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
  L6:
    role_family: classifier
    subroles: [routing-classifier]
    routing_classes: [routing/classification]
    authority_cap: [recommend-only]
    authority_prohibited: [prose, implementation, review, approve, merge, control-plane]
    frontier_only: false
    independence: not-applicable
    human_gates: [reattestation-by-ratified-amendment]
    provider_rule:
      kind: none
      refusal: LANE_DISABLED_REFUSED
    quality_tolerance: { state: unavailable, residual: DELTA_L_UNSET }
    status: disabled-refused
    re_enablement: ratified-amendment-required
    re_enablement_candidates: [opencode/qwen3.8-flash, opencode/glm-5.3-flash]

candidates:
  alpha-model:
    family: sample-vendor
    bindings:
      - id: opencode/alpha-model
        provider: opencode
        model: alpha-model
        family: sample-vendor
        identity: { state: resolved, source: fixture }
        endpoint: { registered: https://opencode.ai/zen/go/v1, catalogue: https://opencode.ai/zen/v1, alignment: divergent }
        data_classes: { state: unknown, residual: DATA_CLASS_UNKNOWN }
        capabilities: { tool-use: unverified, structured-output: unverified }
        context_window_tokens: { state: declared, value: 1000, source: fixture }
        max_output_tokens: { state: declared, value: 100, source: fixture }
        cost: { state: declared, value: { unit: usd_per_mtok, input: 1, output: 2 }, source: fixture }
        availability: { state: unproven, residual: AVAILABILITY_UNVERIFIED }
        quality: { state: unproven, residual: QUALITY_UNRECORDED }
      - id: openrouter/anthropic/claude-opus-5.5
        provider: openrouter
        model: anthropic/claude-opus-5.5
        family: anthropic
        identity: { state: resolved, source: fixture }
        endpoint: { registered: https://openrouter.ai/api/v1, catalogue: null, alignment: unknown }
        data_classes: { state: declared, value: [public, internal, restricted], source: fixture }
        capabilities: { tool-use: unverified, structured-output: unverified }
        context_window_tokens: { state: unknown, residual: CONTEXT_UNKNOWN }
        max_output_tokens: { state: unknown, residual: CONTEXT_UNKNOWN }
        cost: { state: unknown, residual: COST_UNKNOWN }
        availability: { state: unproven, residual: AVAILABILITY_UNVERIFIED }
        quality: { state: unproven, residual: QUALITY_UNRECORDED }

lane_routes:
  # The single violation: the fallback is the primary itself.
  - lane: L4
    provider: opencode
    primary: { type: binding, ref: opencode/alpha-model }
    fallback: { type: binding, ref: opencode/alpha-model }
    comparability: { state: unproven, residual: FALLBACK_SUITABILITY_UNPROVEN }
