    routing_classes:
      - implementation/complex
    authority_cap:
      - execution-within-allowed-files
    authority_prohibited:
      - approve
      - merge
      - release
      - policy-bypass
      - self-review
    frontier_only: false
    independence: reviewer-must-be-independent-family
    human_gates:
      - gate-2
    provider_rule:
      kind: declared-preference
      preference:
        state: unavailable
        residual: L3_PROVIDER_PREFERENCE_UNSET
    quality_tolerance:
      state: unavailable
      residual: DELTA_L_UNSET
  L4:
    role_family: builder
    subroles:
      - builder-standard
    routing_classes:
      - standard-feature
      - implementation/standard
    authority_cap:
      - execution-within-allowed-files
    authority_prohibited:
      - approve
      - merge
      - release
      - policy-bypass
      - self-review
    frontier_only: false
    independence: reviewer-independent-where-parcel-risk-requires
    human_gates:
      - gate-2
    provider_rule:
      kind: declared-preference
      preference:
        state: unavailable
        residual: L4_PROVIDER_PREFERENCE_UNSET
    quality_tolerance:
      state: unavailable
      residual: DELTA_L_UNSET
  L5:
    role_family: builder
    subroles:
      - builder-economy
    routing_classes:
      - boilerplate
    authority_cap:
      - execution-within-allowed-files
    authority_prohibited:
      - security
      - approve
      - merge
      - release
      - final-verification
    frontier_only: false
    independence: never-a-verifier
    human_gates:
      - gate-2
    provider_rule:
      kind: cheapest-eligible
    quality_tolerance:
      state: unavailable
      residual: DELTA_L_UNSET
  L6:
    role_family: classifier
    subroles:
      - routing-classifier
    routing_classes:
      - routing/classification
    authority_cap:
      - recommend-only
    authority_prohibited:
      - prose
      - implementation
      - review
      - approve
      - merge
      - verification
      - control-plane
      - promotion
      - cross-provider-fallback
    frontier_only: false
    independence: not-applicable
    human_gates:
      - reattestation-by-ratified-amendment
    provider_rule:
      kind: none
      refusal: LANE_DISABLED_REFUSED
    quality_tolerance:
      state: unavailable
      residual: DELTA_L_UNSET
    status: disabled-refused
    re_enablement: ratified-amendment-required
    re_enablement_candidates:
      - opencode/qwen3.8-flash
      - opencode/glm-5.3-flash
