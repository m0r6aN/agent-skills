    frontier_only: true
    independence: independent-family-from-builder-applies-to-primary-and-fallback
    human_gates:
      - coordinator-acceptance
      - gate-3
    provider_rule:
      kind: pinned-provider
      pinned_provider:
        state: unavailable
        residual: L2_PINNED_PROVIDER_UNSET
    quality_tolerance:
      state: unavailable
      residual: DELTA_L_UNSET
  L3:
    role_family: builder
