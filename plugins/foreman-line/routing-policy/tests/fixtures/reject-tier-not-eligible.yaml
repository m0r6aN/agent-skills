# Rejecting fixture (invariant f, re-anchored at CUTOVER-P4): `openai/gpt-5.6-sol` is a
# legitimate frontier id (it IS in KNOWN_FRONTIER_MODELS) and sits in
# `selection_order.frontier`, but its binding declares no data-class eligibility — it
# can never be dispatched under any classification. Every other invariant and the
# schema are satisfied, so this fixture isolates (f) alone: classification gating runs
# before cost optimization (D6), so an ordered source must not advertise a route that
# cannot exist.
classes:
  boilerplate:
    allowlist:
      - economy
    ceiling_usd: 0.5
  standard-feature:
    allowlist:
      - standard
    ceiling_usd: 5
  architecture/risk:
    allowlist:
      - frontier
    ceiling_usd: 25
  implementation/standard:
    allowlist:
      - standard
    ceiling_usd: 5
data_classification:
  public:
    transport_requirements:
      data_collection: allow
      zdr: false
  internal:
    transport_requirements:
      data_collection: deny
      zdr: true
  restricted:
    transport_requirements:
      data_collection: deny
      zdr: true
selection_order:
  frontier:
    - claude-opus-5-5
    - gpt-5.6-sol
  standard:
    - claude-sonnet-5
  economy:
    - claude-haiku-4.5
shadow_routes: {}
compatibility:
  representation: provider-neutral-fallback-contract
  version: 1
  legacy_representation:
    blocks:
      - model_tiers
      - roles
      - data_classification.eligible_models
    id_vocabulary: openrouter-slug-only
    status: deprecated
    removal_serialized_into: PMC-P4
ranking_contract:
  inputs:
    R1: data-class eligibility
    R2: required capability
    R3: independence obligation
    R4: available context
    R5: remaining budget
    R6: verified availability
    R7: recorded quality score
  eligibility_filters:
    - R1
    - R2
    - R3
    - R4
    - R6
  budget_ordering_lane: L5
  quality_ordering_key: R7
  stable_order:
    - declared-matrix-role
    - provider
    - model-id
  evidence_threshold:
    rankable_requires: R1-R6-definite-true-from-a-named-source-and-R7-recorded-for-this-lane
    on_unknown: refuse
  attested_states:
    - static-conformance
    - live-availability
    - model-quality
lane_map:
  L1:
    role_family: coordinator
    subroles:
      - coordinator
      - shaper
      - architect
    routing_classes:
      - architecture/risk
    authority_cap:
