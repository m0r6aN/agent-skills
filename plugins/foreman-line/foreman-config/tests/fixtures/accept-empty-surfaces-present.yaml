# AC10/AC11 accept: explicit `surfaces_present: []` is legal (D28a — [] must
# be WRITTEN; it is omission that is invalid when profile != none).
identity:
  project_key: KONE
  base_branch: main
  branch_prefix: feat/
  worktree_root: ../worktrees
  dispatch_queue: foreman-line-dispatch

stack:
  profile: vite-react-ts-tailwind
  layout:
    route_roots: ["src"]
    style_roots: ["src"]
    component_roots: ["src/components"]
    theme_files: ["src/index.css"]
    ui_primitives: ["src/components/ui"]
  surfaces_present: []

capabilities:
  ticketing: [jira-workflow]

policy:
  audit:
    require_security_audit_at: [elevated]
