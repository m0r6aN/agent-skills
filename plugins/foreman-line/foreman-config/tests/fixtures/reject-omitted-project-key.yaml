# Q4 ruling reject half: OMITTING the `project_key` KEY is a validation
# failure. Declaring "no project key" must be an explicit `project_key: null`
# (see accept-null-identity-values.yaml) — absence-as-exemption is the D26
# erosion this goal exists to prevent.
identity:
  base_branch: main
  branch_prefix: feat/
  worktree_root: ../worktrees
  dispatch_queue: null

stack:
  profile: none

capabilities: {}

policy:
  audit:
    require_security_audit_at: [elevated]
