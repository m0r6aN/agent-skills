# Companion pin to reject-surfaces-present-with-none.yaml, same Q5
# reasoning: with `profile: none`, a `layout` map is the same
# self-contradiction and is likewise prohibited.
identity:
  project_key: LIB
  base_branch: main
  branch_prefix: feat/
  worktree_root: ../worktrees
  dispatch_queue: null

stack:
  profile: none
  layout:
    route_roots: ["src"]
    style_roots: ["src"]
    component_roots: ["src/components"]
    theme_files: ["src/index.css"]
    ui_primitives: ["src/components/ui"]

capabilities: {}

policy:
  audit:
    require_security_audit_at: [elevated]
