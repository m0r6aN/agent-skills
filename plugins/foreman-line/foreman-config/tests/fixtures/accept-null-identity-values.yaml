# Q4 ruling accept half: `project_key` and `dispatch_queue` are REQUIRED
# KEYS whose value may be an explicit `null` — a repo with no tracker has no
# project key and no queue identity, and forcing non-null values would force
# a config that lies. Declaring nothing must be an explicit act (the same
# shape as `stack: none`). Omitting either KEY is rejected — see
# reject-omitted-project-key.yaml / reject-omitted-dispatch-queue.yaml.
identity:
  project_key: null
  base_branch: main
  branch_prefix: feat/
  worktree_root: ../worktrees
  dispatch_queue: null

stack:
  profile: none

capabilities: {}

policy:
  audit:
    require_security_audit_at: [elevated, critical]
