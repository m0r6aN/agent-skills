# AC11 / Q5 ruling reject: with `profile: none`, `surfaces_present` is
# PROHIBITED, not ignored. "This repo has no UI stack" plus "these UI
# surfaces are present" is self-contradictory; a closed schema refuses the
# contradiction rather than silently picking a winner.
identity:
  project_key: LIB
  base_branch: main
  branch_prefix: feat/
  worktree_root: ../worktrees
  dispatch_queue: null

stack:
  profile: none
  surfaces_present: ["charts"]

capabilities: {}

policy:
  audit:
    require_security_audit_at: [elevated]
