    sourceKind: goal-charter
    authorityTier: goal-charter
    authorityEffect: binding
    scope:
      - foreman-kernel
    snapshotEvidence:
      commit: 51857a3a7796b393c0c0a68712f98c06e7015d79
      fullFileSha256: a69b19d69106243a918b2b228b29b8a85d854c8966e3d578ed1036105c90cc84
    inventoryItems:
      - itemId: item.d3
        locator:
          kind: table-row
          anchor: D3-moved
          lineHint: 77
        normalizedExcerpt: "| D3 | The kernel is divided into a provider-neutral trust core, a read-only MCP surface, an admission-protected control surface, and thin host adapters. The control surface uses a distinct local endpoint/socket plus a narrowly issued host-local capability bound to a mechanically distinct principal. | Separate discovery catalogs are not an authorization boundary. An unauthenticated verifier client must be unable to list or call control tools, claim leases, or request transitions. Host quirks must not leak into policy semantics. |"
        valueDigest: c8fe973d1ac3d8113a1007a714c796fcc9097404de7ee91eaf1943c020d34cc8
        ruleIds:
          - rule.fk-charter.d3
        exclusionDisposition: null
        rationale: Rule-bearing section or live behavior is mapped to an explicit source-bound rule.
      - itemId: item.d8
        locator:
          kind: table-row
          anchor: D8
          lineHint: 82
        normalizedExcerpt: "| D8 | Hooks begin in shadow mode. After negative tests, mediated-bypass probes, enrollment detection, and corpus reconciliation, governed mutations fail closed when the loaded adapter cannot reach the kernel. Read-only work may continue only in an explicit degraded mode that records the missing assurance. Enforcement cannot be promoted before independent CI backstops are green. | Failing open makes enforcement claims false; failing every operation closed makes Docker a development-wide outage; promoting before CI leaves unmediated channels without the promised detector. |"
        valueDigest: 52974e08f03f03e55fbdb64ce0f5229b9760031fd54ae7e053ddfbfa052d7909
        ruleIds:
          - rule.fk-charter.d8
        exclusionDisposition: null
        rationale: Rule-bearing section or live behavior is mapped to an explicit source-bound rule.
      - itemId: item.d11
        locator:
          kind: table-row
          anchor: D11
          lineHint: 85
        normalizedExcerpt: "| D11 | A defect class is retired from the agent reading path only after: a deterministic predicate exists, a negative test proves refusal, the existing corpus is swept, and an independent bypass attempt fails. Provenance and rationale remain in the lessons record. | Removing prose before enforcement is proven merely hides the rule. Installing a future rule without reconciling existing instances leaves the class alive. |"
        valueDigest: afd1359afbfe84dcc0f26fc24f0fef2a16a29b0ffaeaeee5599a9d1531a2bbc0
        ruleIds:
          - rule.fk-charter.d11
        exclusionDisposition: null
        rationale: Rule-bearing section or live behavior is mapped to an explicit source-bound rule.
      - itemId: item.d9
        locator:
          kind: table-row
          anchor: D9
          lineHint: 83
        normalizedExcerpt: "| D9 | Human authority is preserved: Gate 1 is nondelegable; Gate 2 may be delegated only by an explicit charter-scoped standing authorization; Gate 3 remains human-owned unless a distinct agent identity is mechanically authorized and verified live. Human-gate satisfaction is derived from canonical, digest-bound Git artifacts and cannot be written as ordinary operational state. | Hooks, MCP, leases, and a local control capability are enforcement mechanisms, not new authority sources. Human-only conditions produce `awaiting_human` stop reports rather than unfinishable stop-hook loops. |"
        valueDigest: c94f713fcb89b9e6f3ef19f2ae85b936fdd0a1896c47a804a13a0696a94cd88e
        ruleIds:
          - rule.fk-charter.d9
        exclusionDisposition: null
        rationale: Rule-bearing section or live behavior is mapped to an explicit source-bound rule.
      - itemId: item.d1
        locator:
          kind: table-row
          anchor: D1
          lineHint: 75
        normalizedExcerpt: "| D1 | This is a new goal, `foreman-kernel`, separate from `plugin-packaging-and-scaffolder`. | The packaging/scaffolder goal owns distribution and canon scaffolding. This goal owns runtime contracts, evaluation, operational state, and hook enforcement. Shared manifests and other serialization points are explicitly sequenced rather than casually co-owned. |"
        valueDigest: 3556946d5827fa66823734342fb6ea250923d0e8d02ab131bb3e767626a04041
        ruleIds:
          - rule.fk-charter.d1
        exclusionDisposition: null
        rationale: Rule-bearing section or live behavior is mapped to an explicit source-bound rule.
      - itemId: item.d7
        locator:
          kind: table-row
          anchor: D7
          lineHint: 81
        normalizedExcerpt: "| D7 | One portable MCP contract is primary. Claude Code on the declared Windows/Docker Desktop matrix receives the first lifecycle adapter. Codex and other hosts receive an adapter only where a real capability probe demonstrates equivalent mediation. Bypass attempts visible to a loaded adapter may be refused; hook absence or non-enrollment is detected by enrollment heartbeat and CI and is never claimed as a hook refusal. | The repo documents that some plugin/session surfaces ignore hooks, MCP, or permission frontmatter. Portability belongs in the protocol and capability matrix, not in a universal enforcement claim. |"
        valueDigest: cae7d015c4ca308343825e6a6159bc8898d8ac47f1cd9e25e5c28f9919743be1
        ruleIds:
          - rule.fk-charter.d7
        exclusionDisposition: null
        rationale: Rule-bearing section or live behavior is mapped to an explicit source-bound rule.
