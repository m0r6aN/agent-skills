        normalizedExcerpt: "### Wave 1 — Pure trust core | Parcel | Outcome | Risk / routing | Dependencies | |---|---|---|---| | FK-P3 — Pure dispatch decisions | Splits routing and skill resolution into deterministic no-I/O decision functions with injected validated policy and stable digests; legacy writers remain compatibility adapters. | elevated / architecture-risk | FK-P1 | | FK-P4 — Verifier facade | One provider-neutral library facade over immediate validators/evaluators; chain results say `STRUCTURAL`; public calls are content-only or use the D19 capability-bound repository reader. | elevated / architecture-risk | FK-P1, FK-P2, FK-P3 | | FK-P5 — Clean-room trust-core spike | Runs the facade against an unrelated fixture repository, including positive, negative, malformed, hostile-path, and degraded-assurance cases. | elevated / standard-feature | FK-P4 | **Wave 1 exit:** every first-release evaluator is deterministic, no-I/O unless explicitly documented, contract-tested, and proven against an unrelated repository."
