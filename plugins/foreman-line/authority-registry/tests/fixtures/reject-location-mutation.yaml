        locator:
          kind: heading
          anchor: "# Goal Charter — Foreman Kernel > ## 1. Objective-moved"
          lineHint: 11
        normalizedExcerpt: "## 1. Objective Turn Foreman Line's strongest procedural controls into a portable governed runtime: 1. deterministic policy and verification capabilities callable through a versioned Docker-hosted MCP surface without package-local installs; 2. durable, revisioned operational goal state that survives process and session restarts while preserving Git as the authority for ratified canon; and 3. thin host hooks that consult the same kernel to observe and, after shadow-mode proof, mechanically refuse a bounded set of high-confidence violations. The first release is successful when an unrelated clean-room repository can use the containerized verifier, resume goal state after a container restart, and prove selected hook refusals without giving the kernel approval, merge, external-write, or generic receipt-minting authority."
        valueDigest: ed423c1c6649e64ace2cb2137ef3f1aed69cba7620c1823bb6871b1ee2775420
        ruleIds:
