      - itemId: item.388a6fe1b0b3
        locator:
          kind: heading
          anchor: "# Goal Charter — Foreman Kernel > ## 2. Problem statement"
          lineHint: 27
        normalizedExcerpt: '## 2. Problem statement Foreman Line already contains substantial deterministic machinery, but its operating controls are split across prose, package-local CLIs, worktree-local permission files, Markdown ownership blocks, and host-specific session behavior. That produces five costs this goal addresses: - agents must reread and remember standing constraints; - permission profiles reduce capability only when the host/session loads them; - exact `Allowed Files` authority is present in spec prose but is not compiled for machine enforcement; - reusable evaluators require per-package dependency installation and some attractive "evaluation" functions also write timestamped artifacts; and - operational goal state is repeatedly reconstructed from Markdown rather than served from a single durable, concurrency-safe ledger. The goal is not to make hooks omnipotent. Hooks mediate only the channels the host exposes. CI, source-control rules, deterministic verification, and human gates remain independent enforcement layers.'
        valueDigest: ab606bccc1af57a41f180846c4e478f2b63c065f74902b40588d3337f5be9170
        ruleIds:
          - rule.fk-charter.388a6fe1b0b3
        exclusionDisposition: null
        rationale: Rule-bearing section or live behavior is mapped to an explicit source-bound rule.
      - itemId: item.b95669aefb57
        locator:
          kind: heading
          anchor: "# Goal Charter — Foreman Kernel > ## 3. Authority hierarchy"
          lineHint: 47
        normalizedExcerpt: "## 3. Authority hierarchy When artifacts disagree, authority resolves in this order: 1. explicit developer ratification or amendment for this goal; 2. this charter's locked decisions; 3. ratified Foreman contracts and `SPEC-CONVENTION.md`; 4. `COORDINATOR-PATTERN.md` and the `goal` skill; 5. parcel specs created under this charter; 6. standing constraints and role kickstarters; 7. generated projections, caches, and advisory documentation. No implementation parcel may silently choose among contradictory authorities. It stops and requests a charter or contract amendment."
        valueDigest: 38545df6582d76da9a9f5d448e4b7d5793dad1df1de7c92325c397a526e2de1f
        ruleIds:
          - rule.fk-charter.b95669aefb57
