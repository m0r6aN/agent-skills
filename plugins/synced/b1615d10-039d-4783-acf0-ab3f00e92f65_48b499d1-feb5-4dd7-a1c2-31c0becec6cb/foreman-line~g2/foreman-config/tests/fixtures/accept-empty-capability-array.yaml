# Coordinator ruling (P1a rework, flagged call #2) accept: a declared
# capability with an EMPTY skill array is a valid document. Unlike
# skill-injection (where an empty array is redundant with key absence),
# declaring a key here has a second meaning absence does not: it extends
# the SPEC-CONVENTION §4.8 involves: vocabulary. `telemetry: []` =
# "telemetry is a known capability area here, and no local skill serves it
# yet". Vocabulary membership and resolution result are independently
# observable (the D21/D27 separation); zero resolution is D14's normal,
# announced-once outcome.
identity:
  project_key: KONE
  base_branch: main
  branch_prefix: feat/
  worktree_root: ../worktrees
  dispatch_queue: foreman-line-dispatch

stack:
  profile: none

capabilities:
  telemetry: []

policy:
  audit:
    require_security_audit_at: [elevated]
